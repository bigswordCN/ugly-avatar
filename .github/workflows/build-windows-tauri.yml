name: Build Tauri (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust (stable)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install dependencies
        run: npm ci

      - name: Ensure WebView2 bootstrapper
        env:
          WEBVIEW2_BOOTSTRAPPER_URL: ${{ secrets.WEBVIEW2_BOOTSTRAPPER_URL }}
        shell: powershell
        run: |
          $url = $env:WEBVIEW2_BOOTSTRAPPER_URL
          if (-not $url) { $url = 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' }
          Write-Host "Downloading WebView2 bootstrapper from: $url"
          New-Item -ItemType Directory -Force -Path src-tauri\webview2 | Out-Null
          Invoke-WebRequest -Uri $url -OutFile src-tauri\webview2\MicrosoftEdgeWebView2InstallerX64.exe -UseBasicParsing

      - name: Build frontend (Vue)
        run: npm run build:tauri

      - name: Build Tauri (Windows bundle)
        run: npx tauri build --target x86_64-pc-windows-msvc --release

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundles
          path: src-tauri/target/release/bundle/**
