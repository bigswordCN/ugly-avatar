name: Build Windows Tauri App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Windows artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-bundle
          uploadWorkflowArtifacts: false

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $outDir = "ugly-avatar-windows-portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          Copy-Item "src-tauri/target/release/ugly-avatar.exe" (Join-Path $outDir "ugly-avatar.exe") -Force

          $webView2Version = "142.0.3595.80"
          $nupkgPath = Join-Path $env:TEMP "WebView2.Runtime.X64.$webView2Version.nupkg"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/WebView2.Runtime.X64/$webView2Version" -OutFile $nupkgPath

          $extractDir = Join-Path $env:TEMP "webview2-runtime-extract"
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          Expand-Archive -Path $nupkgPath -DestinationPath $extractDir -Force

          $runtimeExe = Get-ChildItem $extractDir -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $runtimeExe) { throw "msedgewebview2.exe not found in extracted WebView2 runtime package" }
          $runtimeSourceDir = $runtimeExe.Directory.FullName

          $runtimeDest = Join-Path $outDir "WebView2Runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDest | Out-Null
          Copy-Item (Join-Path $runtimeSourceDir "*") $runtimeDest -Recurse -Force

          Compress-Archive -Path "$outDir\*" -DestinationPath "ugly-avatar-windows-portable.zip" -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ugly-avatar-windows-portable
          path: ugly-avatar-windows-portable.zip
          retention-days: 30
