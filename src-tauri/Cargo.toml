[package]
name = "ugly-avatar"
version = "0.1.0"
description = "Ugly Avatar desktop app"
authors = ["Xuan Tang"]
edition = "2021"
license = "CC-BY-NC-4.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
